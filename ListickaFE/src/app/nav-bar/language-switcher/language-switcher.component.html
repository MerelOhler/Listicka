<ion-button>
  <fa-icon [icon]="faGlobe"></fa-icon>

  <ion-select value="{{selectedLanguage()}}" (ionChange)="changeLanguage($event)" interface="popover">
    @if (languages().length > 0) {
    @for(language of languages(); track $index){
    <ion-select-option value="{{language.languageCode}}">{{language.languageNameInLanguage}}</ion-select-option>
    }
    }
  </ion-select>
</ion-button>
